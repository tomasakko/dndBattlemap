<app-modal-dialog
  heading="Add Map"
  submitLabel="Add map"
  (submitted)="submitted.emit()"
  (cancelled)="cancelled.emit()"
>
  <label for="map-title">Map title</label>
  <input
    id="map-title"
    class="ui-text-input"
    type="text"
    required
    maxlength="80"
    [value]="title()"
    (input)="updateTitle($event)"
  />
</app-modal-dialog>
