<nav [attr.aria-label]="ariaLabel()">
  <details #dropdown>
    <summary>
      <span class="picker-label">{{ label() }}</span>
    </summary>
    <div class="picker-options">
      @for (item of items(); track item.id) {
        <div class="picker-option" [class.current]="item.id === currentId()">
          <button
            type="button"
            [attr.aria-current]="item.id === currentId() ? 'true' : null"
            [disabled]="locked() && item.id !== currentId()"
            (click)="selected.emit(item.id)"
          >
            <span class="item-label">{{ item.label }}</span>
            @if (item.badgeLabel) {
              <span class="badge">({{ item.badgeLabel }})</span>
            }
          </button>
          <button
            type="button"
            class="picker-remove"
            [attr.aria-label]="removeLabel() + item.label"
            [disabled]="locked()"
            (click)="removed.emit({ id: item.id, name: item.label })"
          >
            Remove
          </button>
        </div>
      } @empty {
        <p class="picker-note">{{ emptyText() }}</p>
      }
      @if (locked() && lockedNote()) {
        <p class="picker-note">{{ lockedNote() }}</p>
      }
    </div>
  </details>
</nav>
