<nav [attr.aria-label]="ariaLabel()">
  <details #dropdown>
    <summary>
      @if (icon(); as glyph) {
        <span class="material-symbols-outlined" aria-hidden="true">{{ glyph }}</span>
      }
      <span class="picker-label">{{ label() }}</span>
      <span class="material-symbols-outlined expand" aria-hidden="true">expand_more</span>
    </summary>
    <div class="picker-options">
      @for (item of items(); track item.id) {
        <div class="picker-option" [class.current]="item.id === currentId()">
          <button
            type="button"
            [attr.aria-current]="item.id === currentId() ? 'true' : null"
            [disabled]="locked() && item.id !== currentId()"
            (click)="selected.emit(item.id)"
          >
            @if (item.icon) {
              <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
            }
            <span class="item-label">{{ item.label }}</span>
            @if (item.badgeIcon) {
              <span class="material-symbols-outlined" role="img" [attr.aria-label]="item.badgeLabel">{{
                item.badgeIcon
              }}</span>
            }
          </button>
          <button
            type="button"
            class="picker-remove"
            [attr.aria-label]="removeLabel() + item.label"
            [disabled]="locked()"
            (click)="removed.emit({ id: item.id, name: item.label })"
          >
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </div>
      } @empty {
        <p class="picker-note">{{ emptyText() }}</p>
      }
      @if (locked() && lockedNote()) {
        <p class="picker-note">{{ lockedNote() }}</p>
      }
    </div>
  </details>
</nav>
