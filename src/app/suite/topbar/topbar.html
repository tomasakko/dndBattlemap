<header class="topbar">
  <a class="home" routerLink="/" [class.active]="tabs.activeId() === null">Home</a>

  <nav class="tabs" aria-label="Open apps">
    @for (tab of tabs.tabs(); track tab.app.id) {
      <div class="tab" [class.active]="tab.app.id === tabs.activeId()">
        <button type="button" class="tab-label" (click)="tabs.activate(tab)">
          {{ tab.app.name }}
        </button>
        <button type="button" class="tab-close" [attr.aria-label]="'Close ' + tab.app.name" (click)="tabs.close(tab)">×</button>
      </div>
    }
  </nav>

  <div class="project-actions">
    <button type="button" class="action" title="Save project to file" (click)="save()">Save project</button>
    <button type="button" class="action" title="Load project from file" (click)="openFilePicker()">Load project</button>
    <input #fileInput type="file" accept=".json,application/json" hidden (change)="onFileSelected($event)" />
  </div>
</header>
