<div class="portal">
  @if (project.summaryError(); as error) {
    <p class="note" role="alert">Could not load project summaries: {{ error }}</p>
  } @else if (contents().length === 0) {
    <p class="note">The project is empty</p>
  } @else {
    <ul class="contents" aria-label="Project contents">
      @for (entry of contents(); track entry.app.id) {
        <li>
          <button type="button" class="content-item" (click)="tabs.open(entry.app)">
            <span class="icon" [class.filled]="entry.app.iconFilled" aria-hidden="true">{{ entry.app.icon }}</span>
            <span class="name">{{ entry.app.name }}</span>
            <span class="summary">
              @for (item of entry.items; track item.label; let last = $last) {
                {{ item.count }} {{ item.label }}{{ last ? '' : ', ' }}
              }
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>
