@if (stats(); as s) {
  <div class="backdrop" (click)="backdropClick($event)">
    <section class="card" role="dialog" aria-modal="true" aria-labelledby="statblock-title">
      <header>
        <div>
          <h2 id="statblock-title">{{ combatant().name }}</h2>
          @if (!editing()) {
            <p class="subtitle">
              {{ sizeAndType() || 'Size and type not set' }}{{ s.alignment ? ', ' + s.alignment : '' }}
            </p>
          }
        </div>
        <button #close type="button" class="icon-button" aria-label="Close statblock" (click)="closed.emit()">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </header>
      @if (editing()) {
        @if (draft(); as draftStats) {
          <app-statblock-editor
            [stats]="draftStats"
            [sections]="sections"
            (textChanged)="setText($event.key, $event.value)"
            (numberChanged)="setNumber($event.key, $event.value)"
            (speedChanged)="setSpeed($event.movement, $event.value)"
            (abilityChanged)="setAbility($event.ability, $event.value)"
            (entryChanged)="setEntry($event.key, $event.change)"
            (entryAdded)="addEntry($event)"
            (entryRemoved)="removeEntry($event.key, $event.index)"
            (saved)="save()"
            (cancelled)="stopEditing()"
          />
        }
      } @else {
        <app-statblock-details
          [stats]="s"
          [sections]="sections"
          [customised]="customised()"
          (edit)="startEdit()"
          (reset)="resetToDefault()"
        />
      }
    </section>
  </div>
}
