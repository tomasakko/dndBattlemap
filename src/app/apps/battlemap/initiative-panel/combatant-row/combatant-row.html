<li
  class="card"
  [class.player]="combatant().side === 'player'"
  [class.active]="active()"
  [attr.aria-current]="active() ? 'step' : null"
>
  <div class="top">
    <button
      type="button"
      class="score"
      [attr.aria-label]="'Initiative ' + combatant().initiative + '. Make it ' + combatant().name + '’s turn'"
      title="Make it their turn"
      (click)="setActive()"
    >
      {{ combatant().initiative }}
    </button>
    <span class="name" [attr.title]="combatant().name + ' (' + sideLabel() + ' – ' + typeLabel() + ')'">
      {{ combatant().name }}
    </span>
    @if (combatant().side === 'enemy') {
      <button
        type="button"
        class="small-btn"
        [attr.aria-label]="'Show statblock: ' + combatant().name"
        (click)="showStatblock.emit(combatant())"
      >
        Stats
      </button>
    }
    <button
      type="button"
      class="small-btn remove"
      [attr.aria-label]="'Remove ' + combatant().name"
      (click)="remove()"
    >
      Remove
    </button>
  </div>

  @if (combatant().side === 'enemy') {
    @if (maxHp() > 0) {
      <div class="hp">
        @if (editingHp()) {
          <input
            #hpInput
            class="hp-edit"
            type="number"
            inputmode="numeric"
            min="0"
            [max]="maxHp()"
            step="1"
            [value]="hp()"
            [attr.aria-label]="'Hit points of ' + combatant().name"
            (keydown.enter)="commitHp(hpInput.value)"
            (keydown.escape)="editingHp.set(false)"
            (blur)="commitHp(hpInput.value)"
          />
        } @else {
          <button
            type="button"
            class="hp-text"
            [attr.aria-label]="'Edit hit points of ' + combatant().name"
            title="Click to type the hit points"
            (click)="editHp()"
          >
            HP {{ hp() }}/{{ maxHp() }}
          </button>
        }
        <input
          class="hp-slider"
          type="range"
          min="0"
          step="1"
          [max]="maxHp()"
          [value]="hp()"
          [style.--fill]="hpFill()"
          [attr.aria-label]="'Hit points of ' + combatant().name"
          (input)="slideHp($event)"
        />
      </div>
    } @else {
      <p class="hp-hint">Add hit points in the statblock to track HP.</p>
    }
  }
</li>
