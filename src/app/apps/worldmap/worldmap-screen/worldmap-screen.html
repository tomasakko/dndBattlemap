<div class="workspace">
  <div #map class="map" [class.placing]="placing()"></div>

  @if (!current()) {
    <div class="empty">
      <p>Upload an image to use as your world map.</p>
    </div>
  }

  <app-dropdown-picker
    class="map-picker"
    ariaLabel="World maps"
    emptyText="No maps uploaded"
    removeLabel="Remove map "
    [items]="mapItems()"
    [currentId]="current()?.id ?? null"
    [label]="current()?.name ?? 'Choose Map'"
    (selected)="selectMap($event)"
    (removed)="removeMap($event.id, $event.name)"
  />

  <header class="top-actions">
    <app-file-button label="Upload Map" (fileSelected)="onFileSelected($event)" />
    @if (error()) {
      <p class="ui-error" role="alert">{{ error() }}</p>
    }
    @if (persistenceError(); as message) {
      <p class="ui-error" role="alert">{{ message }}</p>
    }
  </header>

  <a class="ui-btn player-screen-link" routerLink="/worldmap/player" target="_blank" rel="noopener" aria-label="Open player screen" title="Open player screen">
    Player screen
  </a>

  @if (current()) {
    <div class="ui-toolbar" role="toolbar" aria-label="World map tools">
      <button
        type="button"
        class="ui-btn"
        title="Add marker"
        aria-label="Add marker"
        [attr.aria-pressed]="placing()"
        (click)="togglePlacing()"
      >
        Add marker
      </button>
      <button type="button" class="ui-btn" title="Reset view" aria-label="Reset view" (click)="resetView()">
        Reset view
      </button>
      @if (placing()) {
        <span class="hint">Click the map to place a marker</span>
      }
    </div>
  }

  @if (pendingFile()) {
    <app-map-upload-dialog
      [title]="mapTitle()"
      (titleChanged)="mapTitle.set($event)"
      (cancelled)="cancelUpload()"
      (submitted)="confirmUpload()"
    />
  }
</div>
