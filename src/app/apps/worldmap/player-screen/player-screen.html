<main class="stage">
  @if (current(); as entry) {
    <svg class="map" #stage [attr.viewBox]="viewBox()" role="img" [attr.aria-label]="entry.name">
      <image
        [attr.href]="entry.image.url"
        x="0"
        y="0"
        [attr.width]="entry.image.width"
        [attr.height]="entry.image.height"
      />
    </svg>
    <!-- Clouds, birds and the like drift between the map and the markers. -->
    <app-worldmap-ambience [animated]="ambientAnimated()" />
    <svg class="map markers" [attr.viewBox]="viewBox()">
      @for (marker of markers(); track marker.id) {
        <g class="marker" [attr.transform]="'translate(' + marker.x + ' ' + marker.y + ')'">
          <title>{{ marker.name }}</title>
          @if (iconPath(marker); as d) {
            <path
              class="marker-pin"
              [attr.d]="d"
              [attr.transform]="'scale(' + pixel() * iconScale + ') translate(-256 -256)'"
              [attr.fill]="marker.color"
              [attr.stroke]="marker.border"
              stroke-width="40"
              stroke-linejoin="round"
              paint-order="stroke"
            />
          } @else {
            <circle
              class="marker-pin"
              [attr.r]="pixel() * 10"
              [attr.stroke-width]="pixel() * 3"
              [attr.fill]="marker.color"
              [attr.stroke]="marker.border"
            />
          }
          <text
            class="marker-name"
            text-anchor="middle"
            dominant-baseline="hanging"
            [attr.y]="pixel() * (iconPath(marker) ? 19 : 14)"
            [attr.font-size]="pixel() * fontSize(marker)"
            [attr.font-family]="font(marker).css"
            [attr.font-weight]="font(marker).weight"
            [attr.stroke-width]="pixel() * 3"
            [attr.fill]="marker.color"
            [attr.stroke]="marker.border"
          >
            {{ marker.name }}
          </text>
        </g>
      }
    </svg>
  } @else {
    <p class="waiting" role="status">Waiting for the Dungeon Master to share a world map.</p>
  }
</main>
