@if (linkedBattlemapId()) {
  <app-player-screen />
} @else {
  <main class="stage">
    @if (current(); as entry) {
      <svg class="map" #stage [attr.viewBox]="viewBox()" role="img" [attr.aria-label]="entry.name">
        <foreignObject x="0" y="0" [attr.width]="entry.image.width" [attr.height]="entry.image.height">
          <app-water-canvas [src]="entry.image.url" />
        </foreignObject>
        <image
          [attr.href]="entry.image.url"
          x="0"
          y="0"
          [attr.width]="entry.image.width"
          [attr.height]="entry.image.height"
        />
        <rect
          class="map-border"
          x="0"
          y="0"
          [attr.width]="entry.image.width"
          [attr.height]="entry.image.height"
        />
        @for (marker of entry.markers; track marker.id) {
          <g
            class="marker"
            [attr.transform]="'translate(' + marker.x + ' ' + marker.y + ')'"
            [style.filter]="'drop-shadow(0 0 1px ' + marker.borderColor + ')'"
          >
            <title>{{ marker.name }}</title>
            <svg
              class="marker-icon"
              [attr.x]="-pixel() * 16"
              [attr.y]="-pixel() * 32"
              [attr.width]="pixel() * 32"
              [attr.height]="pixel() * 32"
              viewBox="0 0 512 512"
            >
              <defs>
                <mask
                  [attr.id]="'worldmap-marker-mask-' + $index"
                  x="0"
                  y="0"
                  width="512"
                  height="512"
                  maskUnits="userSpaceOnUse"
                  maskContentUnits="userSpaceOnUse"
                  style="mask-type: alpha"
                >
                  <image [attr.href]="markerIconAsset(marker.icon)" width="512" height="512" />
                </mask>
              </defs>
              <rect
                width="512"
                height="512"
                [attr.fill]="marker.iconColor"
                [attr.mask]="'url(#worldmap-marker-mask-' + $index + ')'"
              />
            </svg>
            <text
              class="marker-name"
              text-anchor="middle"
              [attr.y]="-pixel() * 36"
              [attr.font-size]="pixel() * 12.5"
              [attr.stroke-width]="pixel() * 3"
            >
              {{ marker.name }}
            </text>
          </g>
        }
      </svg>
    } @else {
      <p class="waiting" role="status">Waiting for the Dungeon Master to share a world map.</p>
    }
  </main>

  <button type="button" class="fullscreen" (click)="toggleFullscreen()">
    {{ isFullscreen() ? 'Exit full screen' : 'Full screen' }}
  </button>
}
