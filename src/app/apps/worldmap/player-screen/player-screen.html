@if (linkedBattlemapId()) {
  <app-player-screen />
} @else {
  <main class="stage">
    @if (current(); as entry) {
      <svg class="map" #stage [attr.viewBox]="viewBox()" role="img" [attr.aria-label]="entry.name">
        <foreignObject x="0" y="0" [attr.width]="entry.image.width" [attr.height]="entry.image.height">
          <app-water-canvas [src]="entry.image.url" />
        </foreignObject>
        <image
          [attr.href]="entry.image.url"
          x="0"
          y="0"
          [attr.width]="entry.image.width"
          [attr.height]="entry.image.height"
        />
        <rect
          class="map-border"
          x="0"
          y="0"
          [attr.width]="entry.image.width"
          [attr.height]="entry.image.height"
        />
        @for (marker of entry.markers; track marker.id) {
          <g class="marker" [attr.transform]="'translate(' + marker.x + ' ' + marker.y + ')'">
            <title>{{ marker.name }}</title>
            <text
              class="marker-icon material-symbols-outlined"
              text-anchor="middle"
              [attr.y]="-pixel() * 3"
              [style.font-size.px]="pixel() * 32"
              [attr.stroke-width]="pixel()"
              [attr.fill]="marker.iconColor"
              [attr.stroke]="marker.borderColor"
            >
              {{ markerGlyph(marker.icon) }}
            </text>
            <text
              class="marker-name"
              text-anchor="middle"
              [attr.y]="-pixel() * 36"
              [attr.font-size]="pixel() * 12.5"
              [attr.stroke-width]="pixel() * 3"
            >
              {{ marker.name }}
            </text>
          </g>
        }
      </svg>
    } @else {
      <p class="waiting" role="status">Waiting for the Dungeon Master to share a world map.</p>
    }
  </main>

  <button type="button" class="fullscreen" (click)="toggleFullscreen()">
    {{ isFullscreen() ? 'Exit full screen' : 'Full screen' }}
  </button>
}
