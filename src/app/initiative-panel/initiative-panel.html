<app-combatant-form />

<div class="turn-controls" role="group" aria-label="Turn controls">
  <button type="button" [disabled]="combatants().length === 0" (click)="previous()">
    <span class="material-symbols-outlined" aria-hidden="true">skip_previous</span>
    Previous
  </button>
  <button type="button" class="primary" [disabled]="combatants().length === 0" (click)="next()">
    {{ activeId() ? 'Next turn' : 'Start' }}
    <span class="material-symbols-outlined" aria-hidden="true">skip_next</span>
  </button>
</div>

@if (activeId()) {
  <button type="button" class="end" (click)="endCombat()">End combat</button>
}

@if (combatants().length === 0) {
  <p class="hint">Nobody in the order yet. Add creatures above.</p>
} @else {
  <div class="order-scroll">
    <ol class="order">
      @for (combatant of combatants(); track combatant.id) {
        <app-combatant-row
          [combatant]="combatant"
          [active]="combatant.id === activeId()"
          (showStatblock)="showStatblock($event)"
        />
      }
    </ol>
  </div>
  <button type="button" class="clear" (click)="clear()">Clear all</button>
}

@if (statblockOf(); as selected) {
  <app-statblock-card [combatant]="selected" (closed)="closeStatblock()" />
}
